Player:
	PlayerResources:
		DefaultCash: 6000
	ExternalCondition@AI:
		Condition: base-rebuilder
	ExternalCondition@AIDefense:
		Condition: defense-rebuilder
	BaseBuilderBotModule@campaign:
		RequiresCondition: base-rebuilder
		BuildingQueues: Building, Defense, Upgrade
		MinimumExcessPower: 0
		MaximumExcessPower: 250
		MaxBaseRadius: 40
		ConstructionYardTypes: construction_yard
		RefineryTypes: refinery
		PowerTypes: wind_trap
		ProductionTypes: light_factory, heavy_factory, barracks
		SellRefineryInterval: -1
		BuildingLimits:
			barracks: 2
			refinery: 2
			outpost: 1
			light_factory: 1
			heavy_factory: 1
			high_tech_factory: 1
			wind_trap: 9
		BuildingFractions:
			wind_trap: 1
			barracks: 1
			refinery: 1
			outpost: 1
			light_factory: 1
			heavy_factory: 1
			high_tech_factory: 1
	BaseBuilderBotModule@defense:
		RequiresCondition: defense-rebuilder
		BuildingQueues: Building, Defense, Upgrade
		MinimumExcessPower: 0
		MaximumExcessPower: 250
		MaxBaseRadius: 40
		ConstructionYardTypes: construction_yard
		RefineryTypes: refinery
		PowerTypes: wind_trap
		ProductionTypes: light_factory, heavy_factory, barracks
		DefenseTypes: artillery_platform, medium_gun_turret
		SellRefineryInterval: -1
		BuildingLimits:
			barracks: 2
			refinery: 2
			outpost: 1
			light_factory: 1
			heavy_factory: 1
			high_tech_factory: 1
			wind_trap: 9
			artillery_platform: 1
			medium_gun_turret: 4
		BuildingFractions:
			wind_trap: 1
			barracks: 1
			refinery: 1
			outpost: 1
			light_factory: 1
			heavy_factory: 1
			high_tech_factory: 1
			artillery_platform: 1
			medium_gun_turret: 1

World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, harkonnen05.lua, harkonnen05-AI.lua
	MissionData:
		Briefing: briefing
		BriefingVideo: H_BR05_E.VQA
	MapOptions:
		TechLevel: 4
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: easy

^Palettes:
	IndexedPlayerPalette:
		PlayerIndex:
			Ordos Main Base: 175, 174, 173, 172, 171, 170, 169, 168, 167, 166, 165, 164, 163, 162, 161, 160
			Ordos Small Base: 175, 174, 173, 172, 171, 170, 169, 168, 167, 166, 165, 164, 163, 162, 161, 160
	FixedPlayerColorShift:
		BasePalette: player
		PlayerIndex:
			Ordos Main Base: 0.060, -0.275, 1, 0.32, 0.34
			Ordos Small Base: 0.060, -0.275, 1, 0.32, 0.34

carryall.reinforce:
	Cargo:
		MaxWeight: 25

frigate:
	Aircraft:
		LandableTerrainTypes: Sand, Rock, Transition, Spice, SpiceSand, Dune, Concrete

outpost:
	ExternalCondition@lua:
		Condition: modified
	Tooltip:
		RequiresCondition: !modified
	Tooltip@Modified:
		Name: actor-outpost-modified-name
		GenericName: meta-building-generic-name
		GenericVisibility: Enemy, Neutral
		NeutralPrefix: neutral-prefix
		ShowOwnerRow: false
		RequiresCondition: modified
