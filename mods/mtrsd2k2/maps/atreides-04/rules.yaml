Player:
	PlayerResources:
		DefaultCash: 6000

World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, atreides04.lua, atreides04-AI.lua
	MissionData:
		Briefing: briefing
		BriefingVideo: A_BR04_E.VQA
	MapOptions:
		TechLevel: 3
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: easy

carryall.reinforce:
	Cargo:
		MaxWeight: 10

nsfremen:
	Buildable:
		Prerequisites: ~sietch
	AutoTarget:
		InitialStanceAI: AttackAnything

# HACK: AI units can't attack the sietch if it was on a real rock
tile475:
	Immobile:
		OccupiesSpace: false
	RenderSprites:
		Palette: d2k
	WithIdleOverlay@2:
		Sequence: idle2
	WithIdleOverlay@3:
		Sequence: idle3
	WithIdleOverlay@4:
		Sequence: idle4
	WithSpriteBody:
	BodyOrientation:
		QuantizedFacings: 1
	Interactable:

# Placed after the sietch is destroyed so that the cliff is still unpassable
invisibleBlocker:
	Building:
		Footprint: xx xx
		Dimensions: 2,2
