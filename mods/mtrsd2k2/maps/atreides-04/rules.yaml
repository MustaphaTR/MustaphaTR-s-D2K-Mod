Player:
	PlayerResources:
		DefaultCash: 6000

World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, atreides04.lua, atreides04-AI.lua
	MissionData:
		Briefing: Our scouts have discovered the hidden Fremen base. The Harkonnen blockade of the Fremen must be broken.\n\nPowerful Harkonnen forces to the South are massing for an assault on the Fremen. Heavy forces have been allocated to you to smash through the Harkonnen fortifications and come to the aid of the Fremen.\n\nGood luck.\n
		BriefingVideo: A_BR04_E.VQA
	MapOptions:
		TechLevel: 3
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: easy

carryall.reinforce:
	Cargo:
		MaxWeight: 10

nsfremen:
	Buildable:
		Prerequisites: ~sietch
	AutoTarget:
		InitialStanceAI: AttackAnything

# HACK: AI units can't attack the sietch if it was on a real rock
tile475:
	AlwaysVisible:
	Immobile:
		OccupiesSpace: false
	RenderSprites:
		Palette: d2k
	WithIdleOverlay@2:
		Sequence: idle2
	WithIdleOverlay@3:
		Sequence: idle3
	WithIdleOverlay@4:
		Sequence: idle4
	WithSpriteBody:
	BodyOrientation:
		QuantizedFacings: 1
	Interactable:

# Placed after the sietch is destroyed so that the cliff is still unpassable
invisibleBlocker:
	AlwaysVisible:
	Building:
		Footprint: xx xx
		Dimensions: 2,2
