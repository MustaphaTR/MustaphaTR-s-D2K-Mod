Player:
	PlayerResources:
		DefaultCash: 7000
	ExternalCondition@AI:
		Condition: base-rebuilder
	ExternalCondition@AIDefense:
		Condition: defense-rebuilder
	BaseBuilderBotModule@campaign:
		RequiresCondition: base-rebuilder
		BuildingQueues: Building, Defense, Upgrade
		MinimumExcessPower: 0
		MaximumExcessPower: 250
		MaxBaseRadius: 40
		ConstructionYardTypes: construction_yard
		RefineryTypes: refinery
		PowerTypes: wind_trap
		ProductionTypes: light_factory, heavy_factory
		SiloTypes: silo
		SellRefineryInterval: -1
		BuildingLimits:
			refinery: 1
			outpost: 1
			light_factory: 1
			heavy_factory: 1
			wind_trap: 6
			silo: 4
		BuildingFractions:
			wind_trap: 1
			refinery: 1
			outpost: 1
			light_factory: 1
			heavy_factory: 1
	BaseBuilderBotModule@defense:
		RequiresCondition: defense-rebuilder
		BuildingQueues: Building, Defense, Upgrade
		MinimumExcessPower: 0
		MaximumExcessPower: 250
		MaxBaseRadius: 40
		ConstructionYardTypes: construction_yard
		RefineryTypes: refinery
		PowerTypes: wind_trap
		ProductionTypes: light_factory, heavy_factory
		SiloTypes: silo
		DefenseTypes: flame_tower, medium_gun_turret
		SellRefineryInterval: -1
		BuildingLimits:
			refinery: 1
			outpost: 1
			light_factory: 1
			heavy_factory: 1
			wind_trap: 6
			silo: 4
			flame_tower: 1
			medium_gun_turret: 7
		BuildingFractions:
			wind_trap: 1
			refinery: 1
			outpost: 1
			light_factory: 1
			heavy_factory: 1
			flame_tower: 1
			medium_gun_turret: 1

World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, atreides05.lua, atreides05-AI.lua
	MissionData:
		Briefing: briefing
		BriefingVideo: A_BR05_E.VQA
	MapOptions:
		TechLevel: 4
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: easy

carryall.reinforce:
	Cargo:
		MaxWeight: 10

frigate:
	Aircraft:
		LandableTerrainTypes: Sand, Rock, Transition, Spice, SpiceSand, Dune, Concrete

barracks.harkonnen:
	Inherits: barracks
	Buildable:
		Prerequisites: ~disabled
	-MustBeDestroyed:

siege_tank.starport:
	Buildable:
		Prerequisites: ~techlevel.4
