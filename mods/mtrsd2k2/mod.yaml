Metadata:
	Title: mod-title
	Version: v2.3
	Website: https://www.openra.net
	WebIcon32: https://www.openra.net/images/icons/d2k_32x32.png
	WindowTitle: mod-windowtitle

PackageFormats: D2kSoundResources

FileSystem: ContentInstallerFileSystem
	SystemPackages:
		^EngineDir
		$mtrsd2k2: mtrsd2k2
		^EngineDir|mods/common: common
		^EngineDir|mods/d2k: d2k
		~^SupportDir|Content/d2k/v3/: content
		common|scripts
		d2k|scripts
		d2k|uibits: d2kuibits
		mtrsd2k2|uibits: mtrsd2k2uibits
	ContentPackages:
		content|SOUND.RS
		content|GAMESFX
		~content|Music
		~content|Movies
		# Below are mod-provided (system) packages that need to be loaded after the content packages so they can override content assets.
		d2k|bits
		mtrsd2k2|bits
		mtrsd2k2|bits/sounds
	RequiredContentFiles:
		content|BLOXBASE.R16
		content|BLOXBAT.R16
		content|BLOXBGBS.R16
		content|BLOXICE.R16
		content|BLOXTREE.R16
		content|BLOXWAST.R16
		content|DATA.R16
		content|MOUSE.R16
		content|PALETTE.BIN
	ContentInstallerMod: mtrsd2k2-content

MapFolders:
	mtrsd2k2|maps: System
	~^SupportDir|maps/d2k/v2.3: User

